name: Release macOS app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "overlay/**"
      - ".github/workflows/release-mac.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build universal .dmg and .zip (unsigned, ad-hoc)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-pet-mac
          path: |
            overlay/dist/*.dmg
            overlay/dist/*.zip
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NapCat ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Unsigned macOS build (universal: Apple Silicon + Intel).
            Download `NapCat-universal.dmg`, drag NapCat to Applications, then right-click it → Open (or run `xattr -cr "/Applications/NapCat.app"`).
          files: |
            overlay/dist/*.dmg
            overlay/dist/*.zip
