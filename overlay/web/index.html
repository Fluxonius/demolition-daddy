<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Pixel</title>
  <link rel="stylesheet" href="pet.css">
  <link rel="stylesheet" href="pixel.css">
</head>
<body>
  <main id="root" class="mood-egg offline">
    <button id="gear" class="gear" type="button" title="Settings…" aria-label="Settings" hidden>⚙</button>
    <button id="inspect" class="gear inspect" type="button" title="Demo / Agent Inspector" aria-label="Demo and Agent Inspector" hidden>AI</button>
    <div id="bubble" class="bubble" hidden>
      <p id="bubble-text"></p>
      <div id="bubble-buttons" class="bubble-buttons" hidden></div>
      <span id="bubble-more" class="bubble-more" hidden></span>
    </div>

    <svg id="pet" class="pet" role="img" aria-label="Pixel the pet"></svg>

    <div class="hud">
      <div class="meter" title="Load"><div id="load-fill" class="meter-fill"></div></div>
      <span id="label" class="label">waiting for state…</span>
    </div>
  </main>
  <script src="sprites.js"></script>
  <script src="pixel.js"></script>
  <script src="display.js"></script>
  <script src="pet.js"></script>
</body>
</html>
