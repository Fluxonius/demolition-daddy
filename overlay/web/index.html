<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Pixel</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <main id="root" class="mood-egg offline">
    <div id="bubble" class="bubble" hidden>
      <p id="bubble-text"></p>
      <div class="bubble-actions">
        <button id="accept" type="button">Let's go</button>
        <button id="dismiss" type="button" class="secondary">Later</button>
      </div>
    </div>

    <svg id="pet" class="pet" viewBox="0 0 120 120" role="img" aria-label="Pixel the pet">
      <ellipse class="shadow" cx="60" cy="110" rx="34" ry="5"/>
      <g class="body-group">
        <path class="egg-shell" d="M60 12 C88 12 98 52 98 74 C98 98 82 108 60 108 C38 108 22 98 22 74 C22 52 32 12 60 12 Z"/>
        <path class="body" d="M60 30 C88 30 100 56 100 78 C100 98 84 106 60 106 C36 106 20 98 20 78 C20 56 32 30 60 30 Z"/>
        <g class="eyes-open">
          <circle class="eye" cx="46" cy="68" r="6"/>
          <circle class="eye" cx="74" cy="68" r="6"/>
          <circle class="glint" cx="48" cy="66" r="2"/>
          <circle class="glint" cx="76" cy="66" r="2"/>
        </g>
        <g class="eyes-closed">
          <path d="M39 69 Q46 74 53 69"/>
          <path d="M67 69 Q74 74 81 69"/>
        </g>
        <path class="mouth mouth-happy" d="M52 82 Q60 90 68 82"/>
        <path class="mouth mouth-flat" d="M53 85 L67 85"/>
        <ellipse class="mouth mouth-yawn" cx="60" cy="86" rx="5" ry="6"/>
        <path class="sweat" d="M92 50 C96 58 98 62 94 65 C90 67 87 62 92 50 Z"/>
      </g>
      <text class="zzz" x="88" y="36">z</text>
      <text class="zzz z2" x="98" y="24">z</text>
    </svg>

    <div class="hud">
      <div class="meter" title="Load"><div id="load-fill" class="meter-fill"></div></div>
      <span id="label" class="label">waiting for state…</span>
    </div>
  </main>
  <script src="pet.js"></script>
</body>
</html>
